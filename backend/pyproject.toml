[project]
name = "examdna-backend"
version = "0.1.0"
description = "AI exam paper restoration/editing/production agent — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "python-multipart",
    "pillow",
    "numpy",
    "pypdfium2",
    "openai>=1.0",
    "google-genai",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
